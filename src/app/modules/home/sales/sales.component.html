<div class=" w-full h-full p-5 overflow-auto bg-white dark:bg-gray-900">
    <div class="container mx-auto h-full p-5 ">

        <ng-template #actionsTpl>
            <div class="flex gap-3">
                <!--                 <button class="btn btn-primary" (click)="addGenerico()">Agregar Venta Generica</button> -->
                <button class="btn btn-secondary" (click)="add()">Agregar Venta</button>
            </div>
        </ng-template>


        <!-- Template para el botón de eliminar venta -->
        <ng-template #deleteTemplate let-row>
            <div class="flex items-center justify-center">
                <button class="px-2.5 py-1 rounded-lg transition-all flex items-center gap-1 shadow-sm font-bold text-[10px]" 
                        [ngClass]="canDelete(row.fecha) ? 'bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 cursor-pointer' : 'bg-gray-50 text-gray-400 border border-gray-200 cursor-not-allowed opacity-60'"
                        [disabled]="!canDelete(row.fecha)"
                        (click)="$event.stopPropagation(); deleteSale(row)" 
                        [title]="canDelete(row.fecha) ? 'Eliminar Venta' : 'Solo se pueden eliminar ventas de hasta 2 días de antigüedad'">
                    <span class="material-symbols-outlined text-[12px] font-bold">delete</span>
                    <span>Eliminar</span>
                </button>
            </div>
        </ng-template>

        <play-table [uid]="'sales'" [columns]="columns" [data]="data" [config]="config" [saveState]="false"
            [actionsTemplate]="actionsTpl" (selectItem)="onSelectItem($event)">
        </play-table>

    </div>
</div>
